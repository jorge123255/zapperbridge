name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]   # tomllib (config layer) needs 3.11+
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (offline, stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Config layer smoke test
        run: ZB_CONFIG=/nonexistent python docker/entrypoint.py check --skip-free-check
  docker-build:
    # build only (no push) so Dockerfile breakage is caught before a tag
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zapperbridge:ci
      - name: Image smoke test (config check, no network sockets)
        run: docker run --rm -e ZB_CONFIG=/nonexistent zapperbridge:ci check --skip-free-check
